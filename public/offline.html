<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00C77A" />
    <title>Gems24 — Offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #eaedf2; color: #1a1a2e; padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      .card {
        max-width: 22rem; padding: 32px 24px; border-radius: 24px; background: #eaedf2;
        box-shadow: -6px -6px 14px rgba(255,255,255,.9), 6px 6px 14px rgba(148,163,184,.55);
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; font-size: .9375rem; color: #4b5563; line-height: 1.5; }
      button {
        width: 100%; height: 44px; border: 0; border-radius: 14px; font-size: .9375rem; font-weight: 600;
        background: #00a862; color: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1e242c; color: #e8eef4; }
        .card { background: #1e242c; box-shadow: -6px -6px 14px rgba(43,52,63,.9), 6px 6px 14px rgba(6,9,12,.75); }
        p { color: #a3adba; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Gems24 couldn't reach the network. Your saved stones and messages are still available once the app reopens.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
